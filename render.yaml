# Render blueprint — one deploy of the whole app (Express serves the built PWA
# + the /api routes from a single HTTPS origin, which is what OAuth and the
# camera/service-worker need). Deploy with: Render dashboard → New → Blueprint →
# pick this repo. Render builds the Dockerfile and provisions HTTPS.
#
# Secrets are `sync: false` — Render prompts for each value in the dashboard and
# never stores them in git. Set them by name; the app reads them at runtime.
services:
  - type: web
    name: nutrition-tracker
    runtime: docker
    plan: free                    # fine for verification; upgrade for always-on
    healthCheckPath: /api/health
    # General deployments are not an Aegean Frontier complete-game release.
    # A complete release requires the manual complete-game CI gate first.
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        sync: false
      # --- Oura (required to wire real credentials) ---
      # OURA_REDIRECT_URI must be https://<this-service-url>/api/oura/callback
      # and must exactly match the Redirect URI on your Oura app.
      - key: OURA_CLIENT_ID
        sync: false
      - key: OURA_CLIENT_SECRET
        sync: false
      - key: OURA_REDIRECT_URI
        sync: false
      # --- Garmin (optional; leave verification false until partner review) ---
      - key: GARMIN_CLIENT_ID
        sync: false
      - key: GARMIN_CLIENT_SECRET
        sync: false
      - key: GARMIN_REDIRECT_URI
        sync: false
      - key: GARMIN_INTEGRATION_VERIFIED
        value: "false"
      # --- Persistence (required; production refuses disposable storage) ---
      # A Neon Postgres connection string. It stores accounts, logs, integration
      # tokens, plans, and legal acceptance records across deploys.
      - key: DATABASE_URL
        sync: false
      # --- Legal launch gate (all required before new signup is enabled) ---
      - key: LEGAL_ENTITY_NAME
        sync: false
      - key: LEGAL_EFFECTIVE_DATE
        sync: false
      - key: LEGAL_GOVERNING_JURISDICTION
        sync: false
      - key: LEGAL_DATA_HOSTING_LOCATION
        sync: false
      - key: LEGAL_CONTACT_EMAIL
        sync: false
      - key: LEGAL_YEAR
        sync: false
      - key: LEGAL_REVIEWED
        sync: false
      # --- Optional extras ---
      - key: ANTHROPIC_API_KEY     # label OCR (Claude vision)
        sync: false
      - key: FDC_API_KEY           # USDA fallback
        sync: false
      - key: APPLE_INGEST_TOKEN    # gate the Apple companion's ingest
        sync: false
