<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Fuel">
  <!-- v2 editorial identity: the app's own ▣ status-mark motif in Ivory/Ink/
       Cobalt (the pre-v2 emerald leaf belonged to a different visual system).
       Frame inset 112 keeps the corners (203.6 from center) inside the
       maskable safe zone (radius 204.8), so the same file serves the
       circle-cropped Android maskable icon without clipping. -->
  <rect width="512" height="512" fill="#f7f4ec"/>
  <rect x="112" y="112" width="288" height="288" fill="none" stroke="#121210" stroke-width="24"/>
  <rect x="192" y="192" width="128" height="128" fill="#1f35c4"/>
</svg>
